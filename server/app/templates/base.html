<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMM Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">
    <nav class="sidebar">
        <div class="brand">
            <div class="brand-title">RMM Panel</div>
            <div class="brand-subtitle">Remote operations console</div>
        </div>

        <div class="user-info">
            <span>{{ username }}</span>
            <span class="role-chip">{{ role }}</span>
        </div>

        <div class="nav">
            <a href="/dashboard" class="nav-item {% if active=='dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/agents" class="nav-item {% if active=='agents' %}active{% endif %}">Agents</a>
            <a href="/logs" class="nav-item {% if active=='logs' %}active{% endif %}">Audit Logs</a>
            {% if role == 'admin' %}
            <a href="/admin" class="nav-item {% if active=='admin' %}active{% endif %}">Admin</a>
            {% endif %}
            <a href="/logout" class="nav-item nav-logout">Logout</a>
        </div>
    </nav>

    <main class="main">
        {% block content %}{% endblock %}
    </main>
</div>

<div id="toast-container"></div>

<script>
    let accessToken = "{{ session.get('access_token', '') }}";

    async function apiFetch(url, options = {}) {
        options.headers = {
            ...(options.headers || {}),
            "Authorization": `Bearer ${accessToken}`,
            "Content-Type": options.body instanceof FormData ? undefined : "application/json",
        };
        if (options.body instanceof FormData) {
            delete options.headers["Content-Type"];
        }
        const res = await fetch(url, options);
        if (res.status === 401) {
            window.location = "/login";
            return res;
        }
        if (!res.ok && res.status >= 500) {
            showToast(`Server error ${res.status}`, "error");
        }
        return res;
    }

    function showToast(msg, type = "info", ms = 4000) {
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.textContent = msg;
        document.getElementById("toast-container").appendChild(toast);
        setTimeout(() => toast.remove(), ms);
    }

    function escHtml(s) {
        return String(s || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function formatTime(t) {
        if (!t || t === "None") return "Never";
        const d = new Date(t);
        const diff = (Date.now() - d) / 1000;
        if (diff < 60) return "just now";
        if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
        return d.toLocaleString("ru-RU");
    }

    function formatUptime(secs) {
        if (!secs) return "-";
        const d = Math.floor(secs / 86400);
        const h = Math.floor(secs % 86400 / 3600);
        const m = Math.floor(secs % 3600 / 60);
        return `${d}d ${h}h ${m}m`;
    }
</script>

{% block scripts %}{% endblock %}
</body>
</html>
