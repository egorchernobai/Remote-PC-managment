{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <div>
        <div class="toolbar" style="margin-bottom:6px">
            <a href="/agents" class="text-link">Agents</a>
            <span class="table-muted">/</span>
            <span class="table-muted" id="agent-hostname">Loading...</span>
        </div>
        <h1 class="page-title">Agent details</h1>
    </div>
    <span id="agent-status-badge" class="badge badge-neutral">-</span>
</div>

<div class="grid-2">
    <div class="card">
        <div class="section-label" style="margin-bottom:12px">System</div>
        <table id="sys-table">
            <tr><td class="table-muted">OS</td><td id="si-os">-</td></tr>
            <tr><td class="table-muted">Hostname</td><td id="si-host">-</td></tr>
            <tr><td class="table-muted">Uptime</td><td id="si-uptime">-</td></tr>
            <tr><td class="table-muted">Last seen</td><td id="si-seen">-</td></tr>
        </table>
    </div>
    <div class="card">
        <div class="section-label" style="margin-bottom:12px">Resources</div>
        <div class="resource-row">
            <div class="resource-head"><span>CPU</span><span id="cpu-val">-</span></div>
            <div class="meter"><div id="cpu-bar" class="meter-bar"></div></div>
        </div>
        <div class="resource-row">
            <div class="resource-head"><span>Memory</span><span id="mem-val">-</span></div>
            <div class="meter"><div id="mem-bar" class="meter-bar" style="background:var(--success)"></div></div>
        </div>
        <div class="resource-row" style="margin-bottom:0">
            <div class="resource-head"><span>Disk</span><span id="disk-val">-</span></div>
            <div class="meter"><div id="disk-bar" class="meter-bar" style="background:var(--warn)"></div></div>
        </div>
    </div>
</div>

<div class="tabs" id="tabs">
    <button onclick="switchTab('processes')" class="tab-btn active" data-tab="processes">Processes</button>
    <button onclick="switchTab('commands')" class="tab-btn" data-tab="commands">Commands</button>
    <button onclick="switchTab('files')" class="tab-btn" data-tab="files">Files</button>
</div>

<div id="tab-processes" class="card tab-panel">
    <div class="card-header">
        <h2 class="card-title">Running processes</h2>
        <input type="text" id="proc-search" placeholder="Filter..." style="width:220px" oninput="filterProcesses()">
    </div>
    <table>
        <thead><tr><th>PID</th><th>Name</th><th>CPU</th><th>Memory MB</th><th>Action</th></tr></thead>
        <tbody id="proc-tbody"></tbody>
    </table>
</div>

<div id="tab-commands" class="card tab-panel" style="display:none">
    <div class="card-header">
        <h2 class="card-title">Execute command</h2>
    </div>
    <div class="grid-2">
        <div>
            <label>Type</label>
            <select id="cmd-type">
                <option value="shell">Shell command</option>
                <option value="script">Bash/PS script</option>
                <option value="process_list">List processes</option>
                <option value="service_list">List services</option>
                <option value="service_start">Start service</option>
                <option value="service_stop">Stop service</option>
            </select>
        </div>
        <div>
            <label>Timeout (sec)</label>
            <input type="number" id="cmd-timeout" value="60" min="5" max="300">
        </div>
    </div>
    <textarea id="cmd-input" rows="6" placeholder="Enter command..." style="margin-bottom:12px"></textarea>
    <button id="cmd-submit" onclick="submitCommand()">Execute</button>
    <div id="cmd-history" style="margin-top:22px">
        <div class="section-label" style="margin-bottom:10px">Recent commands</div>
        <div id="cmd-list"></div>
    </div>
</div>

<div id="tab-files" class="card tab-panel" style="display:none">
    <div class="card-header">
        <h2 class="card-title">File transfer</h2>
    </div>
    <label>Upload file to agent</label>
    <div class="toolbar" style="align-items:stretch">
        <input type="file" id="file-input" style="flex:1">
        <button onclick="uploadFile()">Upload</button>
    </div>
    <div id="upload-status" class="table-muted" style="margin-top:8px"></div>
    <div id="transfer-list"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const AGENT_ID = "{{ agent_id }}";
let allProcesses = [];

async function loadAgentData() {
    const res = await apiFetch(`/api/v1/agents/${AGENT_ID}`);
    if (!res.ok) return;
    const a = await res.json();
    const si = a.os_info || {};

    document.getElementById("agent-hostname").textContent = a.hostname;
    const badge = document.getElementById("agent-status-badge");
    badge.textContent = a.status;
    badge.className = `badge badge-${a.status}`;

    document.getElementById("si-os").textContent = `${si.os_name || "?"} ${si.os_version || ""}`;
    document.getElementById("si-host").textContent = si.hostname || a.hostname;
    document.getElementById("si-uptime").textContent = formatUptime(si.uptime_secs);
    document.getElementById("si-seen").textContent = formatTime(a.last_seen);

    setBar("cpu", si.cpu_usage, `${(si.cpu_usage || 0).toFixed(1)}%`);
    setBar("mem", si.mem_usage, `${(si.mem_used_mb || 0).toLocaleString()} / ${(si.mem_total_mb || 0).toLocaleString()} MB`);
    const diskPct = si.disk_total_gb > 0 ? (1 - si.disk_free_gb / si.disk_total_gb) * 100 : 0;
    setBar("disk", diskPct, `${(si.disk_free_gb || 0).toFixed(1)} GB free of ${(si.disk_total_gb || 0).toFixed(1)} GB`);

    if (si.processes) {
        allProcesses = si.processes;
        renderProcesses(si.processes);
    }
}

function setBar(id, pct, label) {
    const v = Math.min(Math.max(pct || 0, 0), 100);
    const bar = document.getElementById(`${id}-bar`);
    bar.style.width = v + "%";
    document.getElementById(`${id}-val`).textContent = label;
    if (v > 85) bar.style.background = "var(--danger)";
    else if (v > 60) bar.style.background = "var(--warn)";
}

function renderProcesses(procs) {
    const tbody = document.getElementById("proc-tbody");
    tbody.innerHTML = procs.map(p => `<tr>
        <td class="table-muted">${p.pid}</td>
        <td>${escHtml(p.name)}</td>
        <td>${p.cpu.toFixed(1)}%</td>
        <td>${p.mem_mb}</td>
        <td><button class="btn-danger btn-sm" onclick="killProcess(${p.pid}, '${escHtml(p.name)}')">Kill</button></td>
    </tr>`).join("");
}

function filterProcesses() {
    const q = document.getElementById("proc-search").value.toLowerCase();
    renderProcesses(allProcesses.filter(p =>
        p.name.toLowerCase().includes(q) || String(p.pid).includes(q)
    ));
}

async function killProcess(pid, name) {
    if (!confirm(`Kill process "${name}" (PID ${pid})?`)) return;
    const res = await apiFetch("/api/v1/commands/", {
        method: "POST",
        body: JSON.stringify({agent_id: AGENT_ID, command: String(pid), cmd_type: "process_kill"})
    });
    if (res.ok) {
        showToast("Kill signal sent", "success");
        setTimeout(loadAgentData, 3000);
    } else {
        showToast("Failed to send kill signal", "error");
    }
}

async function submitCommand() {
    const btn = document.getElementById("cmd-submit");
    const cmdType = document.getElementById("cmd-type").value;
    const cmdText = document.getElementById("cmd-input").value.trim();
    if (!cmdText) return showToast("Command cannot be empty", "error");

    btn.disabled = true;
    btn.textContent = "Running...";

    const res = await apiFetch("/api/v1/commands/", {
        method: "POST",
        body: JSON.stringify({agent_id: AGENT_ID, command: cmdText, cmd_type: cmdType})
    });
    const data = await res.json();
    if (!res.ok) {
        btn.disabled = false;
        btn.textContent = "Execute";
        return showToast(data.error || "Command failed", "error");
    }

    const cmdId = data.command_id;
    const card = document.createElement("div");
    card.className = "card";
    card.style.marginBottom = "8px";
    card.innerHTML = `<div class="toolbar" style="justify-content:space-between;margin-bottom:8px">
        <code class="mono" style="color:var(--accent)">${escHtml(cmdText.substring(0, 60))}</code>
        <span id="status-${cmdId}" class="badge badge-pending">pending</span>
    </div><pre id="output-${cmdId}" style="margin:0;min-height:20px"></pre>`;
    document.getElementById("cmd-list").prepend(card);

    for (let i = 0; i < 30; i++) {
        await new Promise(r => setTimeout(r, 2000));
        const r2 = await apiFetch(`/api/v1/commands/${cmdId}/result`);
        if (r2.ok) {
            const d = await r2.json();
            if (d.status !== "pending" && d.status !== "running") {
                const status = document.getElementById(`status-${cmdId}`);
                status.textContent = d.exit_code === 0 ? "done" : "failed";
                status.className = d.exit_code === 0 ? "badge badge-online" : "badge badge-offline";
                document.getElementById(`output-${cmdId}`).textContent = d.output || "(no output)";
                break;
            }
        }
    }
    btn.disabled = false;
    btn.textContent = "Execute";
}

async function uploadFile() {
    const fi = document.getElementById("file-input");
    const st = document.getElementById("upload-status");
    if (!fi.files[0]) return showToast("Select a file first", "error");

    const fd = new FormData();
    fd.append("file", fi.files[0]);
    st.textContent = "Uploading...";

    const res = await fetch(`/api/v1/files/upload/${AGENT_ID}`, {
        method: "POST",
        headers: {"Authorization": `Bearer ${accessToken}`},
        body: fd
    });
    const data = await res.json();
    if (res.ok) st.textContent = `Uploaded. SHA256: ${data.sha256}`;
    else st.textContent = `Error: ${data.error}`;
}

function switchTab(name) {
    document.querySelectorAll(".tab-panel").forEach(el => el.style.display = "none");
    document.getElementById(`tab-${name}`).style.display = "block";
    document.querySelectorAll(".tab-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === name);
    });
}

loadAgentData();
setInterval(loadAgentData, 20000);
</script>
{% endblock %}
