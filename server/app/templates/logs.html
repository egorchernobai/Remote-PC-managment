{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Audit Logs</h1>
        <div class="page-kicker">Security and operator activity</div>
    </div>
    <button onclick="exportLogs()">Export CSV</button>
</div>

<div class="card">
    <div class="toolbar">
        <div style="flex:1;min-width:220px">
            <label>Action filter</label>
            <input type="text" id="filter-action" placeholder="command_issued" oninput="loadLogs()">
        </div>
        <div style="flex:1;min-width:220px">
            <label>Actor ID</label>
            <input type="text" id="filter-actor" placeholder="UUID" oninput="loadLogs()">
        </div>
        <button style="align-self:flex-end" onclick="loadLogs()">Apply</button>
    </div>
</div>

<div class="card">
    <table>
        <thead><tr>
            <th>Time</th><th>Actor</th><th>Type</th>
            <th>Action</th><th>Target</th><th>IP</th><th>Details</th>
        </tr></thead>
        <tbody id="logs-tbody"></tbody>
    </table>
    <div class="toolbar" style="justify-content:space-between;margin-top:14px">
        <span id="log-info" class="table-muted"></span>
        <div class="toolbar">
            <button class="btn-secondary" id="btn-prev" onclick="changePage(-1)" disabled>Prev</button>
            <button class="btn-secondary" id="btn-next" onclick="changePage(1)">Next</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let totalPages = 1;
let allLogs = [];

const ACTION_COLORS = {
    "command_issued": "var(--accent)",
    "blocked_dangerous_command": "var(--danger)",
    "user_created": "var(--success)",
    "user_deleted": "var(--danger)",
    "agent_deleted": "var(--warn)",
    "file_upload": "var(--info)",
    "registered": "var(--success)",
};

async function loadLogs() {
    const action = document.getElementById("filter-action").value.trim();
    const actor = document.getElementById("filter-actor").value.trim();
    const params = new URLSearchParams({page: currentPage, per_page: 50});
    if (action) params.set("action", action);
    if (actor) params.set("actor", actor);

    const res = await apiFetch(`/api/v1/admin/logs?${params}`);
    if (!res.ok) return;
    const data = await res.json();

    allLogs = data.items;
    totalPages = data.pages;
    document.getElementById("log-info").textContent =
        `${data.total} entries, page ${currentPage} of ${data.pages || 1}`;

    renderLogs(data.items);
    document.getElementById("btn-prev").disabled = currentPage <= 1;
    document.getElementById("btn-next").disabled = currentPage >= totalPages;
}

function renderLogs(logs) {
    const tbody = document.getElementById("logs-tbody");
    tbody.innerHTML = logs.map(l => {
        const color = ACTION_COLORS[l.action] || "var(--muted)";
        const details = l.details ? JSON.stringify(l.details).substring(0, 90) : "-";
        const time = new Date(l.created_at).toLocaleString("ru-RU");
        return `<tr>
            <td class="table-muted" style="white-space:nowrap">${time}</td>
            <td class="mono">${escHtml((l.actor_id || "-").substring(0, 8))}</td>
            <td><span class="badge badge-neutral">${escHtml(l.actor_type || "-")}</span></td>
            <td><span style="color:${color}">${escHtml(l.action)}</span></td>
            <td>${escHtml(l.target || "-")}</td>
            <td class="table-muted">${escHtml(l.ip_address || "-")}</td>
            <td class="table-muted" style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                title="${escHtml(JSON.stringify(l.details || {}))}">${escHtml(details)}</td>
        </tr>`;
    }).join("");
}

function changePage(delta) {
    currentPage = Math.max(1, Math.min(totalPages, currentPage + delta));
    loadLogs();
}

function exportLogs() {
    if (!allLogs.length) return showToast("No logs loaded", "error");
    const headers = ["time", "actor_id", "actor_type", "action", "target", "ip", "details"];
    const rows = allLogs.map(l =>
        [l.created_at, l.actor_id, l.actor_type, l.action, l.target, l.ip_address, JSON.stringify(l.details)]
            .map(v => `"${String(v || "").replace(/"/g, '""')}"`)
            .join(",")
    );
    const csv = [headers.join(","), ...rows].join("\n");
    const blob = new Blob([csv], {type: "text/csv"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `audit_logs_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
}

loadLogs();
setInterval(loadLogs, 30000);
</script>
{% endblock %}
