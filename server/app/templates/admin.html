{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Admin</h1>
        <div class="page-kicker">Users and deployment packages</div>
    </div>
    <div class="toolbar">
        <select id="agent-package-target" style="width:auto;min-width:170px">
            <option value="native">Current machine</option>
            <option value="windows-x64">Windows x64</option>
            <option value="linux-x64">Linux x64</option>
            <option value="linux-arm64">Linux ARM64</option>
        </select>
        <button class="btn-secondary" id="agent-package-btn" onclick="downloadAgentPackage()">Build agent</button>
        <button onclick="showCreateModal()">Create user</button>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h2 class="card-title">Users</h2>
    </div>
    <table>
        <thead><tr>
            <th>Name</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th>
        </tr></thead>
        <tbody id="users-tbody"></tbody>
    </table>
</div>

<div id="create-modal" class="modal">
    <div class="modal-panel" style="max-width:420px">
        <h3 class="card-title" style="margin-bottom:16px">New user</h3>
        <label>Username</label>
        <input type="text" id="new-username" style="margin-bottom:12px">
        <label>Password</label>
        <input type="password" id="new-password" style="margin-bottom:12px">
        <label>Role</label>
        <select id="new-role" style="margin-bottom:18px">
            <option value="viewer">viewer</option>
            <option value="operator">operator</option>
            <option value="admin">admin</option>
        </select>
        <div class="toolbar">
            <button onclick="createUser()">Create</button>
            <button class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadUsers() {
    const res = await apiFetch("/api/v1/admin/users");
    if (!res.ok) return;
    const users = await res.json();
    const tbody = document.getElementById("users-tbody");
    tbody.innerHTML = users.map(u => `<tr>
        <td><strong>${escHtml(u.username)}</strong></td>
        <td><span class="badge badge-neutral">${escHtml(u.role)}</span></td>
        <td>${u.is_active
            ? '<span class="badge badge-online">active</span>'
            : '<span class="badge badge-offline">disabled</span>'}</td>
        <td class="table-muted">${formatTime(u.created_at)}</td>
        <td>
            <button class="btn-secondary btn-sm" onclick="toggleUser('${u.id}', ${!u.is_active})">
                ${u.is_active ? 'Disable' : 'Enable'}
            </button>
            <button class="btn-danger btn-sm" onclick="deleteUser('${u.id}','${escHtml(u.username)}')">Delete</button>
        </td>
    </tr>`).join("");
}

function showCreateModal() { document.getElementById("create-modal").style.display = "flex"; }
function closeCreateModal() { document.getElementById("create-modal").style.display = "none"; }

async function createUser() {
    const username = document.getElementById("new-username").value.trim();
    const password = document.getElementById("new-password").value;
    const role = document.getElementById("new-role").value;
    if (!username || !password) return showToast("Fill username and password", "error");

    const res = await apiFetch("/api/v1/admin/users", {
        method: "POST",
        body: JSON.stringify({username, password, role})
    });
    const data = await res.json();
    if (res.ok) {
        showToast(`User ${username} created`, "success");
        closeCreateModal();
        loadUsers();
    } else {
        showToast(data.error || "Create failed", "error");
    }
}

async function toggleUser(id, newState) {
    const res = await apiFetch(`/api/v1/admin/users/${id}`, {
        method: "PATCH",
        body: JSON.stringify({is_active: newState})
    });
    if (res.ok) {
        showToast("User updated", "success");
        loadUsers();
    }
}

async function deleteUser(id, name) {
    if (!confirm(`Delete user "${name}"?`)) return;
    const res = await apiFetch(`/api/v1/admin/users/${id}`, {method: "DELETE"});
    if (res.ok) {
        showToast(`${name} deleted`, "success");
        loadUsers();
    } else {
        showToast("Delete failed", "error");
    }
}

async function downloadAgentPackage() {
    const btn = document.getElementById("agent-package-btn");
    const targetSelect = document.getElementById("agent-package-target");
    const target = targetSelect.value;
    btn.disabled = true;
    targetSelect.disabled = true;
    btn.textContent = "Building...";

    try {
        const res = await apiFetch(`/api/v1/admin/agent-package?target=${encodeURIComponent(target)}`);
        if (!res.ok) {
            let message = "Package build failed";
            try {
                const data = await res.json();
                message = data.error || message;
            } catch (_) {}
            showToast(message, "error", 7000);
            return;
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `rmm-agent-package-${target}.zip`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast("Agent package ready", "success");
    } finally {
        btn.disabled = false;
        targetSelect.disabled = false;
        btn.textContent = "Build agent";
    }
}

loadUsers();
</script>
{% endblock %}
